<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exploding Kittens Online - Find Opponent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: left;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .waiting {
            color: #667eea;
            font-weight: bold;
        }

        .error {
            color: #e74c3c;
        }

        .success {
            color: #27ae60;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐱 Exploding Kittens</h1>
        <p class="subtitle">Find an opponent and join a game</p>

        <div class="input-group">
            <label for="playerName">What's your name?</label>
            <input
                type="text"
                id="playerName"
                placeholder="Enter your name"
                maxlength="20"
            >
        </div>

        <button id="joinBtn" onclick="joinGame()">Join Game</button>

        <div class="status" id="status"></div>
    </div>

    <script>
        const playerNameInput = document.getElementById('playerName');
        const joinBtn = document.getElementById('joinBtn');
        const statusDiv = document.getElementById('status');

        const QUEUE_KEY = 'exploding_kittens_queue';
        const GAME_KEY = 'exploding_kittens_game';

        function joinGame() {
            const playerName = playerNameInput.value.trim();

            if (!playerName) {
                showStatus('Please enter your name', 'error');
                return;
            }

            if (playerName.length < 2) {
                showStatus('Name must be at least 2 characters', 'error');
                return;
            }

            disableInput();
            showStatus('<span class="spinner"></span><span class="waiting">Waiting for opponent...</span>');

            let queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');

            if (queue.length > 0) {
                const opponent = queue.shift();
                localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));

                const gameId = generateGameId();
                const game = {
                    id: gameId,
                    player1: opponent.name,
                    player2: playerName,
                    createdAt: new Date().toISOString()
                };

                localStorage.setItem(GAME_KEY, JSON.stringify(game));
                localStorage.removeItem('exploding_kittens_gamestate');
                localStorage.setItem(QUEUE_KEY, JSON.stringify([])); // Clear queue to prevent conflicts

                showStatus('<span class="success">✓ Opponent found! Game starting...</span>');

                setTimeout(() => {
                    startGame(gameId, playerName, 2);
                }, 1500);
            } else {
                const playerData = {
                    name: playerName,
                    joinedAt: new Date().toISOString()
                };
                queue.push(playerData);
                localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));

                pollForOpponent(playerName);
            }
        }

        function pollForOpponent(playerName) {
            let pollInterval;
            let hasNavigated = false;

            const checkForGame = () => {
                if (hasNavigated) return;

                const game = JSON.parse(localStorage.getItem(GAME_KEY));

                if (game && (game.player1 === playerName || game.player2 === playerName)) {
                    if (pollInterval) clearInterval(pollInterval);
                    window.removeEventListener('storage', storageListener);
                    hasNavigated = true;

                    showStatus('<span class="success">✓ Opponent found! Game starting...</span>');

                    const playerNum = game.player1 === playerName ? 1 : 2;
                    setTimeout(() => {
                        startGame(game.id, playerName, playerNum);
                    }, 1500);
                }
            };

            // Fire immediately when another tab writes to localStorage (cross-tab)
            const storageListener = (e) => {
                if (e.key === GAME_KEY) {
                    checkForGame();
                }
            };
            window.addEventListener('storage', storageListener);

            pollInterval = setInterval(checkForGame, 500);

            setTimeout(() => {
                if (pollInterval) clearInterval(pollInterval);
                window.removeEventListener('storage', storageListener);

                if (!hasNavigated) {
                    const game = JSON.parse(localStorage.getItem(GAME_KEY));

                    if (game && !(game.player1 === playerName || game.player2 === playerName)) {
                        enableInput();
                        showStatus('Game started without you. Try again!', 'error');
                    } else if (!game) {
                        enableInput();
                        showStatus('No opponent found. Try again!', 'error');
                    }

                    let queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
                    queue = queue.filter(p => p.name !== playerName);
                    localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
                }
            }, 120000);
        }

        function startGame(gameId, playerName, playerNum) {
            window.location.href = `game.html?player=${playerNum}`;
        }

        function generateGameId() {
            return 'game_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function showStatus(message, type) {
            statusDiv.innerHTML = message;
            statusDiv.className = 'status' + (type ? ' ' + type : '');
        }

        function disableInput() {
            playerNameInput.disabled = true;
            joinBtn.disabled = true;
        }

        function enableInput() {
            playerNameInput.disabled = false;
            joinBtn.disabled = false;
        }

        playerNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                joinGame();
            }
        });

        window.addEventListener('load', () => {
            const queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
            const fiveMinutesAgo = Date.now() - (5 * 60 * 1000);

            const freshQueue = queue.filter(p => new Date(p.joinedAt).getTime() > fiveMinutesAgo);
            if (freshQueue.length !== queue.length) {
                localStorage.setItem(QUEUE_KEY, JSON.stringify(freshQueue));
            }

            const game = JSON.parse(localStorage.getItem(GAME_KEY) || 'null');
            if (game && new Date(game.createdAt).getTime() < (Date.now() - (60 * 60 * 1000))) {
                localStorage.removeItem(GAME_KEY);
                localStorage.removeItem('exploding_kittens_gamestate');
            }
        });
    </script>
</body>
</html>
